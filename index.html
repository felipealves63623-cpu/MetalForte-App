<style>
:root{color-scheme:dark;--bg:#16171a;--s1:#202226;--s2:#2b2e33;--tx:#ececec;--mu:#9a9fa6;--or:#f77300;--ln:#33363b;--ok:#6fcf8a;--er:#ff6b5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,sans-serif;margin:0 0 6px;letter-spacing:.02em}h3{font-size:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#1f1f1f;border-bottom:2px solid var(--or);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
header img{height:48px;width:auto;max-width:80vw;display:block}#stat{font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(22,23,26,.96);backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;background:none;border:0;color:var(--mu);font:600 13px Barlow,sans-serif;letter-spacing:.03em;min-height:56px}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--or)}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font:inherit;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button.b{background:var(--or);color:#111;border:0;border-radius:10px;padding:11px 14px;font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.04em;min-height:46px}
button.g{background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font:inherit;min-height:46px}
button.x{background:none;border:0;color:var(--er);font-size:20px;min-width:44px;min-height:44px}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--s2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px 12px;margin-top:6px;font:inherit;min-height:48px}
.pick small,.mu{color:var(--mu)}.pick b{color:var(--or);white-space:nowrap;margin-left:8px}
.list{max-height:300px;overflow:auto;margin-top:6px}
.it{border-top:1px solid var(--ln);padding:10px 0}.it:first-child{border:0}
.it .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tot{font:700 32px 'Barlow Condensed',sans-serif;color:var(--or)}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.warn{color:var(--er);font-size:13px}.empty{color:var(--mu);text-align:center;padding:18px 8px}
.hide{display:none}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
#mf>summary{font:700 19px 'Barlow Condensed',sans-serif;letter-spacing:.03em;color:var(--or);min-height:30px}
.cg{background:var(--s1);border:1px solid var(--ln);border-radius:14px;margin-bottom:8px;overflow:hidden}
.cg>summary{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;min-height:50px;font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:.03em}
.cg[open]>summary{border-bottom:1px solid var(--ln);color:var(--or)}
.mr{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 14px;border-top:1px solid var(--ln)}.cg>summary+.mr{border:0}
