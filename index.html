<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metal Forte – Orçamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1f1f1f;--s1:#292929;--s2:#333;--tx:#e6e6e6;--mu:#a0a0a0;--or:#f77300;--ln:#404040;--ok:#6fcf8a;--er:#ff6b5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,sans-serif;margin:0;letter-spacing:.02em}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:3px solid var(--or)}
header img{height:42px;max-width:60vw}
nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
nav button{flex:1;padding:13px 4px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:600 17px 'Barlow Condensed',sans-serif;letter-spacing:.04em;margin-bottom:-1px}
nav button.on{color:var(--or);border-color:var(--or)}
main{padding:14px;max-width:760px;margin:auto}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:10px;font:inherit;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button.b{background:var(--or);color:#111;border:0;border-radius:6px;padding:11px 14px;font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.04em;min-height:44px}
button.g{background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;font:inherit;min-height:44px}
button.x{background:none;border:0;color:var(--er);font-size:20px;min-width:44px;min-height:44px}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--s2);border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:10px 12px;margin-top:6px;font:inherit;min-height:48px}
.pick small,.mu{color:var(--mu)}.pick b{color:var(--or);white-space:nowrap;margin-left:8px}
.list{max-height:260px;overflow:auto;margin-top:6px}
.it{border-top:1px solid var(--ln);padding:10px 0}.it:first-child{border:0}
.it .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.tot{font:700 30px 'Barlow Condensed',sans-serif;color:var(--or)}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.warn{color:var(--er);font-size:13px}.empty{color:var(--mu);text-align:center;padding:18px 8px}
.hide{display:none}
#pr{display:none}
@media print{body{background:#fff;color:#000}header,nav,main{display:none}#pr{display:block;padding:20px;font:14px Barlow,sans-serif;color:#000}#pr table{width:100%;border-collapse:collapse}#pr td,#pr th{border-bottom:1px solid #bbb;padding:6px;text-align:left}#pr .r{text-align:right}#pr .hd{background:#1f1f1f;padding:10px;margin-bottom:14px}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:focus-within{border-color:var(--or)}}
</style></head><body>

  <div class="row" style="margin-top:8px"><button class="b" id="sv">Salvar orçamento</button><button class="g" id="pdf">Imprimir / PDF</button></div>
  <div class="row" style="margin-top:8px"><button class="g" id="wa">Copiar texto (WhatsApp)</button><button class="g" id="nv">Novo orçamento</button></div>

<section id="m" class="hide">
 <div class="card"><h3 id="mt">Novo material</h3>
  <label>Nome</label><input id="mn" placeholder="Ex.: Metalon 30x30 chapa 18">
  <div class="row"><div><label>Categoria</label><input id="mc" list="cats" placeholder="Tubos, chapas…"><datalist id="cats"></datalist></div>
  <div><label>Unidade de compra</label><select id="mu"><option value="m">metro (m)</option><option value="kg">quilo (kg)</option><option value="m2">m²</option><option value="un">unidade</option></select></div></div>
  <div class="row"><div><label>Preço por unidade (R$)</label><input id="mp" inputmode="decimal" placeholder="0,00"></div>
  <div><label>Peso kg por metro (opcional)</label><input id="mk" inputmode="decimal" placeholder="Ex.: 1,2"></div></div>

</section>
<section id="h" class="hide"><div id="hl"></div></section>

<div id="pr"></div>
<script>
const $=s=>document.querySelector(s),KEY='mf_v1';
let D={mats:[],orcs:[],n:0},Q,sel=null,edit=null;
try{D=Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));$('#stat').textContent='Salvo'}catch(e){$('#stat').textContent='Sem armazenamento'}};
const num=v=>{const x=parseFloat(String(v||'').replace(/\./g,'').replace(',','.'));return isNaN(x)?0:x};
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fm=v=>v.toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U={mm:['L',.001,'mm'],cm:['L',.01,'cm'],m:['L',1,'m'],g:['M',.001,'g'],kg:['M',1,'kg'],cm2:['A',1e-4,'cm²'],m2:['A',1,'m²'],un:['U',1,'un']};
const newQ=()=>({id:Date.now(),num:null,cli:'',dat:new Date().toISOString().slice(0,10),obra:'',obs:'',dsc:'',mrg:'',it:[]});
Q=newQ();
function conv(q,u,mat){const a=U[u],b=U[mat.u];let v=q*a[1];
 if(a[0]!=b[0]){const k=num(mat.kg);if(!k)return null;if(a[0]=='L'&&b[0]=='M')v*=k;else if(a[0]=='M'&&b[0]=='L')v/=k;else return null}
 return v/b[1]}
function unitsFor(mat){const g=U[mat.u][0],k=num(mat.kg);return Object.keys(U).filter(u=>U[u][0]==g||(k&&((g=='L'&&U[u][0]=='M')||(g=='M'&&U[u][0]=='L'))))}
const price=m=>num(m.p);
/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));['o','m','h'].forEach(t=>$('#'+t).classList.toggle('hide',t!=b.dataset.t));if(b.dataset.t=='h')rH();if(b.dataset.t=='m')rM();scrollTo(0,0)});
/* materiais */
function rM(){const q=$('#mq').value.toLowerCase(),L=D.mats.filter(m=>(m.n+m.c).toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n));
 $('#cats').innerHTML=[...new Set(D.mats.map(m=>m.c).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
 $('#ml').innerHTML=L.length?L.map(m=>`<div class="card"><div class="it" style="border:0;padding:0"><div class="t"><span>${esc(m.n)}</span><b style="color:var(--or)">${brl(price(m))}/${U[m.u][2]}</b></div><div class="mu" style="font-size:13px">${esc(m.c||'Sem categoria')}${num(m.kg)?' · '+fm(num(m.kg))+' kg/m':''}</div><div class="row" style="margin-top:8px"><button class="g" onclick="eM(${m.id})">Editar</button><button class="g" onclick="dM(${m.id})">Excluir</button></div></div></div>`).join(''):'<div class="empty">Nenhum material cadastrado ainda. Preencha o formulário acima.</div>'}
$('#mq').oninput=rM;
function clrM(){edit=null;['mn','mc','mp','mk'].forEach(i=>$('#'+i).value='');$('#mu').value='m';$('#mt').textContent='Novo material'}
$('#mx').onclick=clrM;
$('#ms').onclick=()=>{const n=$('#mn').value.trim();if(!n){alert('Informe o nome do material.');return}
 const o={id:edit||Date.now(),n,c:$('#mc').value.trim(),u:$('#mu').value,p:num($('#mp').value),kg:num($('#mk').value)};
 if(edit)D.mats=D.mats.map(m=>m.id==edit?o:m);else D.mats.push(o);store();clrM();rM();rB()};
window.eM=id=>{const m=D.mats.find(x=>x.id==id);edit=id;$('#mn').value=m.n;$('#mc').value=m.c;$('#mu').value=m.u;$('#mp').value=String(m.p).replace('.',',');$('#mk').value=m.kg?String(m.kg).replace('.',','):'';$('#mt').textContent='Editar material';scrollTo(0,0)};
window.dM=id=>{if(confirm('Excluir este material? Orçamentos já salvos não mudam.')){D.mats=D.mats.filter(m=>m.id!=id);store();rM();rB()}};
/* busca no orçamento */
function rB(){const q=$('#bq').value.toLowerCase(),L=D.mats.filter(m=>(m.n+m.c).toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n));
 $('#bl').innerHTML=L.length?L.map(m=>`<button class="pick" onclick="pM(${m.id})"><span>${esc(m.n)}<br><small>${esc(m.c)}</small></span><b>${brl(price(m))}/${U[m.u][2]}</b></button>`).join(''):`<div class="empty">${D.mats.length?'Nada encontrado.':'Cadastre materiais na aba Materiais.'}</div>`}
$('#bq').oninput=rB;
window.pM=id=>{sel=D.mats.find(m=>m.id==id);$('#an').textContent=sel.n;$('#ap').textContent=brl(price(sel))+' / '+U[sel.u][2];
 $('#au').innerHTML=unitsFor(sel).map(u=>`<option value="${u}">${U[u][2]}</option>`).join('');$('#au').value=sel.u;$('#aq').value='';$('#add').classList.remove('hide');$('#bl').classList.add('hide');$('#bq').classList.add('hide');pv();$('#aq').focus()};
function pv(){if(!sel)return;const q=num($('#aq').value),c=conv(q,$('#au').value,sel);$('#aw').textContent=c===null?'Cadastre o peso por metro para converter.':'';$('#ast').textContent=brl((c||0)*price(sel))}
$('#aq').oninput=pv;$('#au').onchange=pv;
const closeA=()=>{sel=null;$('#add').classList.add('hide');$('#bl').classList.remove('hide');$('#bq').classList.remove('hide');$('#bq').value='';rB()};
$('#ac').onclick=closeA;
$('#ao').onclick=()=>{const q=num($('#aq').value),u=$('#au').value,c=conv(q,u,sel);if(!q||c===null){alert('Informe a quantidade.');return}
 Q.it.push({n:sel.n,q,u,b:sel.u,p:price(sel),t:c*price(sel)});closeA();rQ()};
$('#mo').onclick=()=>{const n=prompt('Descrição (ex.: Mão de obra, instalação, frete):');if(!n)return;const v=num(prompt('Valor em R$:'));Q.it.push({n,q:1,u:'un',b:'un',p:v,t:v,x:1});rQ()};
/* orçamento */
function tot(){const s=Q.it.reduce((a,i)=>a+i.t,0),m=s*num(Q.mrg)/100,d=(s+m)*num(Q.dsc)/100;return{s,m,d,t:s+m-d}}
function rQ(){$('#cli').value=Q.cli;$('#dat').value=Q.dat;$('#obra').value=Q.obra;$('#obs').value=Q.obs;$('#dsc').value=Q.dsc;$('#mrg').value=Q.mrg;rT();
 $('#li').innerHTML=Q.it.length?Q.it.map((i,k)=>`<div class="it"><div class="t"><span>${esc(i.n)}</span><span>${brl(i.t)}</span></div><div class="row" style="align-items:center"><span class="mu" style="font-size:14px">${i.x?'Valor avulso':fm(i.q)+' '+U[i.u][2]+' × '+brl(i.p)+'/'+U[i.b][2]}</span><button class="x" style="flex:0" aria-label="Remover" onclick="rI(${k})">✕</button></div></div>`).join(''):'<div class="empty">Escolha um material acima para começar.</div>'}
function rT(){const t=tot();$('#s1').textContent=brl(t.s);$('#s2').textContent='+ '+brl(t.m);$('#s3').textContent='− '+brl(t.d);$('#s4').textContent=brl(t.t)}
window.rI=k=>{Q.it.splice(k,1);rQ()};
[['cli','cli'],['dat','dat'],['obra','obra'],['obs','obs'],['dsc','dsc'],['mrg','mrg']].forEach(([i,k])=>$('#'+i).oninput=e=>{Q[k]=e.target.value;rT()});
$('#sv').onclick=()=>{if(!Q.it.length){alert('Adicione itens antes de salvar.');return}if(!Q.num){Q.num=new Date().getFullYear()+'-'+String(++D.n).padStart(3,'0')}
 Q.total=tot().t;const i=D.orcs.findIndex(o=>o.id==Q.id);if(i>=0)D.orcs[i]=JSON.parse(JSON.stringify(Q));else D.orcs.unshift(JSON.parse(JSON.stringify(Q)));store();alert('Orçamento '+Q.num+' salvo.')};
$('#nv').onclick=()=>{if(Q.it.length&&!confirm('Começar um novo orçamento? Salve o atual antes se quiser mantê-lo.'))return;Q=newQ();rQ()};
const txt=()=>{const t=tot();return 'ORÇAMENTO'+(Q.num?' '+Q.num:'')+' – Metal Forte\nCliente: '+Q.cli+'\n'+(Q.obra?'Serviço: '+Q.obra+'\n':'')+'\n'+Q.it.map(i=>'• '+i.n+(i.x?'':' – '+fm(i.q)+' '+U[i.u][2])+': '+brl(i.t)).join('\n')+'\n\n'+(num(Q.dsc)?'Desconto: '+Q.dsc+'%\n':'')+'TOTAL: '+brl(t.t)+(Q.obs?'\n\n'+Q.obs:'')};
$('#wa').onclick=async()=>{try{await navigator.clipboard.writeText(txt());alert('Texto copiado.')}catch(e){prompt('Copie o texto:',txt())}};
